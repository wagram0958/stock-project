name: DK Lotto Official Data Pipeline

on:
  push:
    paths:
      - "CGC-DK-Lab/scripts/fetch_official_history.py"
      - ".github/workflows/dk-lotto-pipeline.yml"
  workflow_dispatch:
  schedule:
    # 22:30 Asia/Taipei every Tuesday and Friday.
    - cron: "30 14 * * 2,5"

permissions:
  contents: write

jobs:
  fetch-validate-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official Taiwan Lottery data
        run: python CGC-DK-Lab/scripts/fetch_official_history.py
      - name: Validate cleaned history
        run: python CGC-DK-Lab/scripts/validate_history.py CGC-DK-Lab/data/cleaned/lotto649_official.csv
      - name: Build time-safe features
        run: python CGC-DK-Lab/scripts/build_features.py CGC-DK-Lab/data/cleaned/lotto649_official.csv CGC-DK-Lab/data/cleaned/features.csv
      - name: Ensure reports directory exists
        run: mkdir -p CGC-DK-Lab/reports
      - name: Walk-forward exploratory backtest
        run: python CGC-DK-Lab/scripts/walk_forward_backtest.py CGC-DK-Lab/data/cleaned/lotto649_official.csv 100 | tee CGC-DK-Lab/reports/backtest_latest.txt
      - name: Commit refreshed data and report
        run: |
          git config user.name "cgc-dk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CGC-DK-Lab/data CGC-DK-Lab/reports/backtest_latest.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh DK official lotto data and backtest"
            git push
          fi
