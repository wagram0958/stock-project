name: Hermes Data Engine - Offline PR Gate

on:
  push:
    branches:
      - feature/hermes-data-engine
    paths:
      - ".github/workflows/hermes-data-engine-pr-ci.yml"
      - "2026-07-10/hermes-data-engine-1-goodinfo-2/**"
  pull_request:
    paths:
      - ".github/workflows/hermes-data-engine-pr-ci.yml"
      - "2026-07-10/hermes-data-engine-1-goodinfo-2/**"

permissions:
  contents: read

concurrency:
  group: hermes-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 2026-07-10/hermes-data-engine-1-goodinfo-2
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes and test tools
        run: python -m pip install -e . "pytest>=8,<9"
      - name: Run existing offline regression suite
        run: python -m pytest -q
      - name: Validate stored JSON schema only
        run: >
          python -m hermes_data_engine.cli validate
          data/3033.json data/6214.json data/6753.json
          data/1314.json data/2002.json
      - name: Assert legacy snapshots cannot pass a market-data readiness gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hermes_data_engine.readiness import assess_market_readiness

          paths = sorted(Path("data").glob("*.json"))
          assert len(paths) == 5, f"Expected five preserved legacy snapshots, found {len(paths)}"
          for p in paths:
              data = json.loads(p.read_text(encoding="utf-8"))
              result = assess_market_readiness(
                  data,
                  "2026-07-10",
                  session_confirmed=True,
                  session_source="SYNTHETIC CI ATTESTATION -- NOT OFFICIAL PROOF",
              )
              print(f"{p.name}: ready={result['ready']} issues={result['issues']}")
              assert not result["ready"], f"Legacy unusable snapshot unexpectedly passed: {p}"
              assert "price_missing_or_invalid" in result["issues"]
              assert "volume_missing_or_invalid" in result["issues"]
          print("Expected blocks confirmed; zero real-time provider claims made.")
          PY
