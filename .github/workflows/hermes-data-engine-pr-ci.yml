name: Hermes Data Engine - Offline PR Gate

on:
  push:
    branches:
      - feature/hermes-data-engine
    paths:
      - ".github/workflows/hermes-data-engine-pr-ci.yml"
      - "2026-07-10/hermes-data-engine-1-goodinfo-2/**"
  pull_request:
    paths:
      - ".github/workflows/hermes-data-engine-pr-ci.yml"
      - "2026-07-10/hermes-data-engine-1-goodinfo-2/**"

permissions:
  contents: read

concurrency:
  group: hermes-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 2026-07-10/hermes-data-engine-1-goodinfo-2
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes and test tools
        run: python -m pip install -e . "pytest>=8,<9"
      - name: Run existing offline regression suite
        run: python -m pytest -q
      - name: Validate stored JSON schema only
        run: >
          python -m hermes_data_engine.cli validate
          data/3033.json data/6214.json data/6753.json
          data/1314.json data/2002.json
      - name: Report live-data readiness separately from schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("data").glob("*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              status = d.get("quality", {}).get("status", "missing")
              missing = [f for f in ("date", "price", "volume")
                         if d.get(f) is None]
              print(f"{p.name}: quality={status}; missing_critical={','.join(missing) or 'none'}")
          print("Historical snapshots are NOT evidence of current live-provider readiness.")
          PY
